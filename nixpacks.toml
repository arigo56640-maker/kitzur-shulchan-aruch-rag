providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -e backend -e frontend"
]

[phases.build]
cmds = [
  "python backend/scripts/ingest.py"
]

[start]
cmd = "bash scripts/start.sh"
