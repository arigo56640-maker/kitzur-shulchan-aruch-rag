[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitzur_core"
version = "0.1.0"
description = "Backend library for the Kitzur Shulchan Aruch RAG chatbot (CrewAI Flow + DirectorySearchTool + ChromaDB)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "crewai==1.14.4",
    "crewai-tools==1.14.4",
    "chromadb==1.1.1",
    "openai==2.33.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
