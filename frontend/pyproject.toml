[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitzur_chat"
version = "0.1.0"
description = "Chainlit frontend for the Kitzur Shulchan Aruch RAG (Hebrew-only, RTL)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chainlit==2.11.1",
    "kitzur_core",
]

[tool.setuptools.packages.find]
where = ["src"]
